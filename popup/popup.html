<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>QR THAT!</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" type="module"></script>
  </head>
  <body>
    <header class="popup-header">
      <h1 class="popup-title" aria-label="QR THAT!">
        <span class="title-qr" aria-hidden="true">QR</span>
        <span class="title-that" aria-hidden="true">THAT</span><span class="title-bang" aria-hidden="true">!</span>
      </h1>
    </header>
    <div id="qr-code" class="qr-output"></div>
    <p class="url-row">
      <span id="url-kind" class="url-kind-icon" role="img" hidden></span>
      <span id="page-url" class="url">example.com/article</span>
      <button
        id="advanced-toggle"
        class="advanced-button"
        type="button"
        aria-expanded="false"
        aria-controls="advanced-details"
        aria-label="Show advanced details"
        title="Show advanced details"
      ><span class="advanced-button-icon" aria-hidden="true"></span></button>
    </p>
    <section id="advanced-details" class="advanced-details" aria-label="Advanced details" hidden>
      <dl>
        <div>
          <dt>Original</dt>
          <dd id="advanced-original"></dd>
        </div>
        <div>
          <dt>QR payload</dt>
          <dd id="advanced-payload"></dd>
        </div>
        <div>
          <dt>QR</dt>
          <dd id="advanced-qr"></dd>
        </div>
        <div>
          <dt>Density</dt>
          <dd id="advanced-density"></dd>
        </div>
        <div>
          <dt>Sanitization</dt>
          <dd id="advanced-sanitization"></dd>
        </div>
        <div>
          <dt>Rules</dt>
          <dd id="advanced-rules"></dd>
        </div>
      </dl>
    </section>
    <div class="popup-controls">
      <label
        class="sanitize-control"
        title="Removes known tracking information using community-maintained ClearURLs rules. Processing happens locally and may alter the URL."
      >
        <input id="sanitize" type="checkbox" checked>
        <span class="sanitize-icon" aria-hidden="true"></span>
        <span>Sanitize</span>
      </label>
      <button
        id="open-settings"
        class="settings-button"
        type="button"
        title="Open QR THAT! settings"
        aria-label="Open QR THAT! settings"
      ><span class="settings-button-icon" aria-hidden="true"></span></button>
    </div>
  </body>
</html>
