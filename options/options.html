<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>QR THAT! — Settings</title>
    <link rel="stylesheet" href="options.css">
    <script src="options.js" type="module"></script>
  </head>
  <body>
    <main>
      <h1>QR THAT! — Settings</h1>

      <section aria-labelledby="keyboard-shortcut-heading">
        <h2 id="keyboard-shortcut-heading">Keyboard shortcut</h2>
        <p>Current shortcut: <output id="shortcut-value">Loading…</output></p>
        <button id="configure-shortcut" type="button">Configure in Firefox</button>
        <p id="shortcut-error" role="status" hidden></p>
      </section>

      <section aria-labelledby="rules-heading">
        <h2 id="rules-heading">Rules</h2>
        <p>Source: <output id="rules-source">Loading…</output></p>
        <p>Last fetched: <output id="rules-fetched-at">—</output></p>
        <button id="fetch-rules" type="button">Fetch rules</button>
        <p id="rules-result" role="status" hidden></p>
        <label class="automatic-updates">
          <input id="automatic-rules-updates" type="checkbox">
          Automatically update rules
        </label>
        <p id="automatic-updates-error" role="status" hidden></p>
      </section>
    </main>
  </body>
</html>
