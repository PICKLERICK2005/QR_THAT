<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR THAT!</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" type="module"></script>
  </head>
  <body>
    <h1>QR THAT!</h1>
    <div id="qr-code" class="qr-output"></div>
    <p class="url-row">
      <span id="qr-grade" class="qr-grade" role="img" hidden></span>
      <span id="page-url" class="url">example.com/article</span>
    </p>
    <label
      class="sanitize-control"
      title="Removes known tracking information using community-maintained ClearURLs rules. Processing happens locally and may alter the URL."
    >
      <input id="sanitize" type="checkbox" checked>
      <span>Sanitize</span>
    </label>
  </body>
</html>
